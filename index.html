<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <meta name="rnbo-version" content="1.0.0-alpha.5">
    <link rel="stylesheet" href="style/style.css">
    <title>Chowning FM</title>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="rnbo-root">
        <main id="app-shell" aria-label="Chowning FM demo">
            <section id="app-panel">
                <section id="parameter-section" aria-labelledby="parameter-heading">
                    <div class="section-heading">
                        <h2 id="parameter-heading">Operator Relationships</h2>
                    </div>
                    <div id="rnbo-parameter-sliders" aria-live="polite"></div>
                    <div id="fm-visualization-host"></div>
                </section>

                <section id="output-section" aria-labelledby="output-heading">
                    <div class="section-heading">
                        <h2 id="output-heading">Output</h2>
                    </div>
                    <div id="rnbo-output-controls" aria-live="polite"></div>
                </section>
            </section>
        </main>
    </div>

    <!-- Load the script that creates the RNBO device  -->
    <!-- Uncomment if you know the version of your exported RNBO patch to avoid dynamic loading -->
    <!-- <script type="text/javascript" src="https://cdn.cycling74.com/rnbo/latest/rnbo.min.js"></script> -->

    <!-- (Optional) The guardrails.js script isn't required for RNBO to work, and you can skip including it -->
    <!-- It simply offers some helpful error messages for common problems -->
    <script type="text/javascript" src="js/guardrails.js"></script>

    <script type="text/javascript" src="js/template-config.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
    <script type="text/javascript" src="js/skins/default.js"></script>
    <script type="text/javascript" src="js/skins/chowningfm.js"></script>
    <script type="text/javascript" src="js/skins/juno.js"></script>
    <script type="text/javascript" src="js/custom-ui.js"></script>
</body>
</html>
